name: Jadwal Sholat Bot

on:
  schedule:
    - cron: "24 21 * * *"  # Subuh  04:34 WIB = 21:34 UTC
    - cron: "49 4 * * *"   # Dzuhur 11:49 WIB = 04:49 UTC
    - cron: "10 8 * * *"   # Ashar  15:10 WIB = 08:10 UTC
    - cron: "43 10 * * *"  # Maghrib 17:43 WIB = 10:43 UTC
    - cron: "55 11 * * *"  # Isya   18:55 WIB = 11:55 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Commit state jika berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update state jadwal sholat"
          git push 2>/dev/null || true
